upstream user_service {
    server user-service:5000;
}
upstream room_service {
    server room-service:5000;
}
upstream reservation_service {
    server reservation-service:5000;
}

server {
    listen 443 ssl;
    server_name localhost;
    
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Add CORS headers
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

    # User Service routes
    location /api/users {
        proxy_pass http://user_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

    }
    location /api/auth {
        proxy_pass http://user_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

    }

    # Room Service routes
    location /api/rooms {
        proxy_pass http://room_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

    }

    # Reservation Service routes
    location /api/reservations {
        proxy_pass http://reservation_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

    }
}

# Add HTTP to HTTPS redirect
server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}