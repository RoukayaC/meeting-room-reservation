global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "nginx"
    static_configs:
      - targets: ["nginx:80"]
    metrics_path: /metrics

  - job_name: "user-service"
    static_configs:
      - targets: ["user-service:9464"]
    metrics_path: /metrics

  - job_name: "room-service"
    static_configs:
      - targets: ["room-service:9464"]
    metrics_path: /metrics

  - job_name: "reservation-service"
    static_configs:
      - targets: ["reservation-service:9464"]
    metrics_path: /metrics
