# Project identification
sonar.projectKey=meeting-room-reservation
sonar.projectName=Meeting Room Reservation System
sonar.projectVersion=1.0

# Global configuration
sonar.sources=services
sonar.sourceEncoding=UTF-8
sonar.python.coverage.reportPaths=services/*/coverage.xml
sonar.python.xunit.reportPath=services/*/test-reports.xml

# Modules configuration
sonar.modules=user-service,room-service,reservation-service

# User Service module
user-service.sonar.projectName=User Service
user-service.sonar.sources=services/user-service/app
user-service.sonar.tests=services/user-service/tests
user-service.sonar.python.coverage.reportPaths=services/user-service/coverage.xml
user-service.sonar.python.xunit.reportPath=services/user-service/test-reports.xml

# Room Service module
room-service.sonar.projectName=Room Service
room-service.sonar.sources=services/room-service/app
room-service.sonar.tests=services/room-service/tests
room-service.sonar.python.coverage.reportPaths=services/room-service/coverage.xml
room-service.sonar.python.xunit.reportPath=services/room-service/test-reports.xml

# Reservation Service module
reservation-service.sonar.projectName=Reservation Service
reservation-service.sonar.sources=services/reservation-service/app
reservation-service.sonar.tests=services/reservation-service/tests
reservation-service.sonar.python.coverage.reportPaths=services/reservation-service/coverage.xml
reservation-service.sonar.python.xunit.reportPath=services/reservation-service/test-reports.xml

# Exclusions
sonar.exclusions=**/tests/**,**/migrations/**
sonar.coverage.exclusions=**/tests/**,**/migrations/**,**/wsgi.py