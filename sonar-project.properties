# Project identification
sonar.projectKey=meeting-room-reservation # Make sure this key is unique in your SonarQube instance
sonar.projectName=Meeting Room Reservation System
sonar.projectVersion=1.0

# Global configuration
sonar.sourceEncoding=UTF-8
# Define the main source directory if needed, or let modules handle it.
# sonar.sources=.
sonar.exclusions=**/__pycache__/**,**/venv/**,**/.*/**,**/*.md,**/test_*.py,**/migrations/** # Global exclusions

# Define Modules - Comma-separated list of module keys
sonar.modules=user-service,room-service,reservation-service

# --- Module Definitions ---
# Each module needs a unique key and projectBaseDir relative to this file

# User Service module
user-service.sonar.moduleKey=meeting-room-reservation:user-service
user-service.sonar.projectName=User Service
user-service.sonar.projectBaseDir=services/user-service # Correct path relative to root
user-service.sonar.sources=app # Relative to projectBaseDir (i.e., services/user-service/app)
user-service.sonar.tests=tests # Relative to projectBaseDir (i.e., services/user-service/tests)
user-service.sonar.python.coverage.reportPaths=coverage.xml # Path relative to projectBaseDir where test job saves it
user-service.sonar.python.xunit.reportPath=test-report.xml # Path relative to projectBaseDir where test job saves it
user-service.sonar.exclusions=wsgi.py,debug_db.py # Module specific exclusions

# Room Service module
room-service.sonar.moduleKey=meeting-room-reservation:room-service
room-service.sonar.projectName=Room Service
room-service.sonar.projectBaseDir=services/room-service # Correct path relative to root
room-service.sonar.sources=app
room-service.sonar.tests=tests
room-service.sonar.python.coverage.reportPaths=coverage.xml
room-service.sonar.python.xunit.reportPath=test-report.xml
room-service.sonar.exclusions=wsgi.py

# Reservation Service module
reservation-service.sonar.moduleKey=meeting-room-reservation:reservation-service
reservation-service.sonar.projectName=Reservation Service
reservation-service.sonar.projectBaseDir=services/reservation-service # Correct path relative to root
reservation-service.sonar.sources=app
reservation-service.sonar.tests=tests
reservation-service.sonar.python.coverage.reportPaths=coverage.xml
reservation-service.sonar.python.xunit.reportPath=test-report.xml
reservation-service.sonar.exclusions=wsgi.py

# --- Other Settings ---
# sonar.python.pylint.reportPaths=pylint-report.txt # Uncomment if you generate pylint reports
# sonar.python.flake8.reportPaths=flake8-report.txt # Uncomment if you generate flake8 reports
sonar.qualitygate.wait=true # Wait for Quality Gate status
