name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd user-service && pip install -r requirements.txt && cd ..
          cd room-service && pip install -r requirements.txt && cd ..
          cd reservation-service && pip install -r requirements.txt && cd ..
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          cd user-service && python -m pytest tests/ --cov=app && cd ..
          cd room-service && python -m pytest tests/ --cov=app && cd ..
          cd reservation-service && python -m pytest tests/ --cov=app && cd ..
