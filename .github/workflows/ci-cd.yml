# Full GitHub Actions workflow for Multi-Service CI/CD to GKE with Helm & SonarQube
# Version 2: Combined Test and Scan Job
name: Build, Test, Scan, and Deploy Multi-Service App to GKE

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - ".gitattributes"
      # Trigger on changes in services, nginx, helm, or this workflow
      - '!services/**'
      - '!nginx/**'
      - '!helm/**'
      - '!.github/workflows/build-deploy-multi.yml' # Adjust filename if needed
  workflow_dispatch: # Allows manual triggering
    inputs:
      environment:
        description: "Environment to deploy to (namespace)"
        required: true
        default: "prod"
        type: choice
        options:
          - prod
          - dev
          # Add test if you have a test env setup

# --- Global Environment Variables ---
env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }} # e.g., europe-west1
  GAR_LOCATION: ${{ secrets.GCP_REGION }} # GAR location, often same as region
  GAR_REPOSITORY: meeting-room-repo # Name of your GAR Docker repository

  # Define image names within GAR
  IMAGE_USER_SERVICE: user-service
  IMAGE_ROOM_SERVICE: room-service
  IMAGE_RESERVATION_SERVICE: reservation-service
  IMAGE_NGINX: meeting-room-nginx # Naming nginx specifically

  GKE_CLUSTER_NAME: ${{ secrets.GKE_CLUSTER_NAME || 'meeting-room-cluster' }} # Adjust default if needed
  GKE_ZONE: ${{ secrets.GKE_ZONE || format('{0}-b', secrets.GCP_REGION) }} # Example: europe-west1-b, adjust as needed
  NAMESPACE: ${{ github.event.inputs.environment || 'prod' }} # Target K8s namespace

  HELM_CHART_PATH: ./helm/meeting-room-system # Adjust if your chart path is different
  HELM_RELEASE_NAME: meeting-room-system # Helm release name

jobs:
  test-and-scan: # Combined Test and SonarQube Scan Job
    name: Run Tests and SonarQube Scan
    runs-on: ubuntu-latest
    # Only run on pushes to main/master, not PRs unless SonarQube is configured for PR decoration
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarQube needs full history

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10" # Or your Flask app's Python version

      - name: Install dependencies for all services and tests
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov # Install common test tools
          echo "Installing dependencies for user-service..."
          pip install -r ./services/user-service/requirements.txt
          echo "Installing dependencies for room-service..."
          pip install -r ./services/room-service/requirements.txt
          echo "Installing dependencies for reservation-service..."
          pip install -r ./services/reservation-service/requirements.txt

      - name: Run tests and generate coverage for all services
        run: |
          echo "Running tests for user-service..."
          # Generate reports directly into the service directories relative to root
          (cd ./services/user-service && python -m pytest tests/ --cov=app --cov-report=xml:coverage.xml --junitxml=test-report.xml)

          echo "Running tests for room-service..."
          (cd ./services/room-service && python -m pytest tests/ --cov=app --cov-report=xml:coverage.xml --junitxml=test-report.xml)

          echo "Running tests for reservation-service..."
          (cd ./services/reservation-service && python -m pytest tests/ --cov=app --cov-report=xml:coverage.xml --junitxml=test-report.xml)

      # --- START DEBUGGING STEP ---
      - name: List files for debugging before scan
        run: |
          echo "Workflow working directory: $(pwd)"
          echo "--- Root Directory ---"
          ls -la
          echo "--- services/ Directory ---"
          ls -la services/ || echo "services/ directory not found"
          echo "--- services/user-service/ Directory ---"
          ls -la services/user-service/ || echo "services/user-service/ directory not found"
          echo "--- services/user-service/app Directory ---"
          ls -la services/user-service/app/ || echo "services/user-service/app/ directory not found"
          echo "--- Finding Report Files ---"
          find . -name 'test-report.xml' -o -name 'coverage.xml'
          echo "-------------------------"
      # --- END DEBUGGING STEP ---

      - name: Set up JDK for SonarQube Scanner
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # Explicitly set the base directory for the scanner
          SONAR_SCANNER_OPTS: -Dsonar.projectBaseDir=.
        # Assumes sonar-project.properties exists at the root and paths within it
        # (like projectBaseDir, sources, tests, reportPaths) are correct relative to the root.

  build-push-deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest
    needs: test-and-scan # Depends on successful test and scan job
    # Only run on pushes to main/master
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    permissions:
      contents: 'read'
      # id-token: 'write' # Use this if switching to Workload Identity Federation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - id: 'auth'
        name: 'Authenticate to Google Cloud (SA Key)'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}' # Using Service Account Key

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: "gke-gcloud-auth-plugin"

      - name: Configure GCP Services
        run: |
          echo "Configuring Docker for Artifact Registry..."
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

          echo "Ensuring Artifact Registry Repository exists..."
          gcloud artifacts repositories create ${{ env.GAR_REPOSITORY }} \
            --project=${{ env.PROJECT_ID }} \
            --repository-format=docker \
            --location=${{ env.GAR_LOCATION }} \
            --description="Meeting Room Services Docker repository" || true

      - name: Set image tag
        id: set_tags
        run: |
          IMAGE_TAG="v$(date +'%Y%m%d')-${GITHUB_SHA::7}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "Using image tag: ${IMAGE_TAG}"

      # Define GAR image path prefix
      - name: Set GAR image path prefix
        run: echo "GAR_IMAGE_PATH_PREFIX=${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}" >> $GITHUB_ENV

      # --- Build and Push Each Service ---
      - name: Build and Push User Service to GAR
        uses: docker/build-push-action@v5
        with:
          context: . # Build from root context
          file: ./services/user-service/Dockerfile # Path relative to root
          push: true
          tags: |
            ${{ env.GAR_IMAGE_PATH_PREFIX }}/${{ env.IMAGE_USER_SERVICE }}:${{ env.IMAGE_TAG }}
            ${{ env.GAR_IMAGE_PATH_PREFIX }}/${{ env.IMAGE_USER_SERVICE }}:latest-${{ env.NAMESPACE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Room Service to GAR
        uses: docker/build-push-action@v5
        with:
          context: . # Build from root context
          file: ./services/room-service/Dockerfile # Path relative to root
          push: true
          tags: |
            ${{ env.GAR_IMAGE_PATH_PREFIX }}/${{ env.IMAGE_ROOM_SERVICE }}:${{ env.IMAGE_TAG }}
            ${{ env.GAR_IMAGE_PATH_PREFIX }}/${{ env.IMAGE_ROOM_SERVICE }}:latest-${{ env.NAMESPACE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Reservation Service to GAR
        uses: docker/build-push-action@v5
        with:
          context: . # Build from root context
          file: ./services/reservation-service/Dockerfile # Path relative to root
          push: true
          tags: |
            ${{ env.GAR_IMAGE_PATH_PREFIX }}/${{ env.IMAGE_RESERVATION_SERVICE }}:${{ env.IMAGE_TAG }}
            ${{ env.GAR_IMAGE_PATH_PREFIX }}/${{ env.IMAGE_RESERVATION_SERVICE }}:latest-${{ env.NAMESPACE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Nginx to GAR
        uses: docker/build-push-action@v5
        with:
          context: ./nginx # Context for nginx
          file: ./nginx/Dockerfile # Assuming Dockerfile exists here
          push: true
          tags: |
            ${{ env.GAR_IMAGE_PATH_PREFIX }}/${{ env.IMAGE_NGINX }}:${{ env.IMAGE_TAG }}
            ${{ env.GAR_IMAGE_PATH_PREFIX }}/${{ env.IMAGE_NGINX }}:latest-${{ env.NAMESPACE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Deployment ---
      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.12.0' # Or latest stable

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER_NAME }}
          location: ${{ env.GKE_ZONE }} # GKE requires zone for regional/zonal clusters

      - name: Deploy to GKE using Helm
        run: |
          echo "Deploying image tag ${{ env.IMAGE_TAG }} to namespace ${{ env.NAMESPACE }}..."

          # Define image repo URL prefix for Helm
          GAR_IMAGE_REPO_PREFIX="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}"
          echo "Using image repository prefix: $GAR_IMAGE_REPO_PREFIX"

          # Update Helm dependencies if needed
          helm dependency update ${{ env.HELM_CHART_PATH }}

          # Deploy using Helm upgrade --install
          # Adjust --set parameters based on your Helm chart's values.yaml structure
          helm upgrade --install ${{ env.HELM_RELEASE_NAME }} ${{ env.HELM_CHART_PATH }} \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            --set global.imageTag=${{ env.IMAGE_TAG }} \
            --set userService.image.repository=$GAR_IMAGE_REPO_PREFIX/${{ env.IMAGE_USER_SERVICE }} \
            --set roomService.image.repository=$GAR_IMAGE_REPO_PREFIX/${{ env.IMAGE_ROOM_SERVICE }} \
            --set reservationService.image.repository=$GAR_IMAGE_REPO_PREFIX/${{ env.IMAGE_RESERVATION_SERVICE }} \
            --set nginx.image.repository=$GAR_IMAGE_REPO_PREFIX/${{ env.IMAGE_NGINX }} \
            --set global.environment=${{ env.NAMESPACE }} \
            # Pass GKE specific values if needed (e.g., disable in-chart DB/Kafka)
            # -f ${{ env.HELM_CHART_PATH }}/values-gke-${{ env.NAMESPACE }}.yaml \
            # Pass secrets securely
            --set database.password=${{ secrets.DB_PASSWORD }} \
            --set oauth.clientSecret=${{ secrets.OAUTH_CLIENT_SECRET }} \
            --wait --timeout 10m # Wait for deployment completion

      - name: Verify deployment rollout status
        run: |
          echo "Verifying deployment rollout status..."
          # Verify each service deployment defined in your Helm chart
          kubectl rollout status deployment/user-service -n ${{ env.NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/room-service -n ${{ env.NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/reservation-service -n ${{ env.NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/nginx -n ${{ env.NAMESPACE }} --timeout=5m # Assuming nginx is a deployment

          echo "Deployment completed successfully!"
          echo "Fetching external IP for service (might take a moment)..."
          sleep 20 # Give LoadBalancer more time
          # Adjust service name to the one exposed externally (likely nginx)
          EXTERNAL_IP=$(kubectl get service nginx -n ${{ env.NAMESPACE }} -o jsonpath="{.status.loadBalancer.ingress[0].ip}")
          if [ -z "$EXTERNAL_IP" ]; then
              echo "::warning::Could not get external IP for nginx service automatically. Check 'kubectl get service -n ${{ env.NAMESPACE }}' manually."
          else
              echo "Service URL (Nginx): http://${EXTERNAL_IP}"
          fi
