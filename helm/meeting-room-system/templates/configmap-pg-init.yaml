apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
data:
  init-db.sql: |
    -- Create databases
    DO $$
    BEGIN
      CREATE EXTENSION IF NOT EXISTS dblink;
      
      IF NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'user_service') THEN
        PERFORM dblink_exec('dbname=' || current_database(), 'CREATE DATABASE user_service');
      END IF;
      
      IF NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'room_service') THEN
        PERFORM dblink_exec('dbname=' || current_database(), 'CREATE DATABASE room_service');
      END IF;
      
      IF NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'reservation_service') THEN
        PERFORM dblink_exec('dbname=' || current_database(), 'CREATE DATABASE reservation_service');
      END IF;
      
      IF NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'sonar') THEN
        PERFORM dblink_exec('dbname=' || current_database(), 'CREATE DATABASE sonar');
      END IF;
    END
    $$;

    -- Grant privileges
    GRANT ALL PRIVILEGES ON DATABASE user_service TO postgres;
    GRANT ALL PRIVILEGES ON DATABASE room_service TO postgres;
    GRANT ALL PRIVILEGES ON DATABASE reservation_service TO postgres;
    GRANT ALL PRIVILEGES ON DATABASE sonar TO postgres;