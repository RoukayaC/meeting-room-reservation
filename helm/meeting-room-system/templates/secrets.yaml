apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
stringData:
  user-service-uri: "postgresql://{{ .Values.database.user }}:{{ .Values.database.password }}@{{ .Values.database.host }}:{{ .Values.database.port }}/user_service"
  room-service-uri: "postgresql://{{ .Values.database.user }}:{{ .Values.database.password }}@{{ .Values.database.host }}:{{ .Values.database.port }}/room_service"
  reservation-service-uri: "postgresql://{{ .Values.database.user }}:{{ .Values.database.password }}@{{ .Values.database.host }}:{{ .Values.database.port }}/reservation_service"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  secret-key: "{{ randAlphaNum 32 }}"
---
apiVersion: v1
kind: Secret
metadata:
  name: oauth-credentials
type: Opaque
stringData:
  client-id: "{{ .Values.oauth.clientId | default "replace-with-oauth-client-id" }}"
  client-secret: "{{ .Values.oauth.clientSecret | default "replace-with-oauth-client-secret" }}"